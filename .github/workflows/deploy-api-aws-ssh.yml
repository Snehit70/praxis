name: Deploy API (AWS via SSH)

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "src/lib/**"
      - "Dockerfile.api"
      - "docker-compose.api.yml"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-api-aws-ssh.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Praxis API on AWS host over SSH
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_PATH: ${{ secrets.PRAXIS_DEPLOY_PATH }}
      AWS_SSH_HOST: ${{ secrets.AWS_SSH_HOST }}
      AWS_SSH_USER: ${{ secrets.AWS_SSH_USER }}
      AWS_SSH_PORT: ${{ secrets.AWS_SSH_PORT }}
      API_DATABASE_URL: ${{ secrets.PRAXIS_API_DATABASE_URL }}
      API_ALLOWED_ORIGIN: ${{ secrets.PRAXIS_API_ALLOWED_ORIGIN }}
      API_SERVER_NAME: ${{ secrets.PRAXIS_API_SERVER_NAME }}
      PDF_DOWNLOADS_ENABLED: ${{ secrets.PRAXIS_PDF_DOWNLOADS_ENABLED }}
      PDF_RATE_LIMIT_BYPASS_USER_IDS: ${{ secrets.PRAXIS_PDF_RATE_LIMIT_BYPASS_USER_IDS }}
      CLERK_SECRET_KEY: ${{ secrets.PRAXIS_CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.PRAXIS_CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deploy secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AWS_SSH_HOST}" || { echo "AWS_SSH_HOST missing"; exit 1; }
          test -n "${AWS_SSH_USER}" || { echo "AWS_SSH_USER missing"; exit 1; }
          test -n "${AWS_SSH_PORT}" || { echo "AWS_SSH_PORT missing"; exit 1; }
          test -n "${{ secrets.AWS_SSH_PRIVATE_KEY }}" || { echo "AWS_SSH_PRIVATE_KEY missing"; exit 1; }
          test -n "${DEPLOY_PATH}" || { echo "PRAXIS_DEPLOY_PATH missing"; exit 1; }
          test -n "${API_DATABASE_URL}" || { echo "PRAXIS_API_DATABASE_URL missing"; exit 1; }
          [[ "${AWS_SSH_PORT}" =~ ^[0-9]+$ ]] || { echo "AWS_SSH_PORT must be numeric"; exit 1; }
          [[ "${DEPLOY_PATH}" = /* ]] || { echo "PRAXIS_DEPLOY_PATH must be absolute"; exit 1; }
          [[ "${AWS_SSH_HOST}" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "AWS_SSH_HOST has invalid characters"; exit 1; }
          [[ "${AWS_SSH_USER}" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "AWS_SSH_USER has invalid characters"; exit 1; }

      - name: Prepare SSH key
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          cat > ~/.ssh/id_ed25519 <<'KEY'
          ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          KEY
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${AWS_SSH_PORT}" -H "${AWS_SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Sync repository to server
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "${AWS_SSH_PORT}" "${AWS_SSH_USER}@${AWS_SSH_HOST}" "mkdir -p '${DEPLOY_PATH}'"
          rsync -az --delete \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=data \
            --exclude=data-new \
            --exclude='data-new-stale-*' \
            --exclude=images \
            --exclude=images-new \
            --exclude=reports \
            --exclude=tools/rescrape/node_modules \
            --exclude=.env \
            --exclude='.env.*' \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${AWS_SSH_PORT}" \
            ./ "${AWS_SSH_USER}@${AWS_SSH_HOST}:${DEPLOY_PATH}/"

      - name: Write API env on server
        shell: bash
        run: |
          set -euo pipefail
          existing="$(mktemp)"
          merged="$(mktemp)"
          trap 'rm -f "${existing}" "${merged}"' EXIT
          # Keep host keys (especially Clerk) unless this run supplies a replacement.
          scp -i ~/.ssh/id_ed25519 -P "${AWS_SSH_PORT}" \
            "${AWS_SSH_USER}@${AWS_SSH_HOST}:${DEPLOY_PATH}/.env.api" "${existing}" \
            || : > "${existing}"
          python3 - "${existing}" "${merged}" <<'PY'
          import os
          import sys

          existing_path, merged_path = sys.argv[1], sys.argv[2]

          def parse(path):
              data = {}
              try:
                  text = open(path, encoding='utf-8').read()
              except FileNotFoundError:
                  return data
              for raw in text.splitlines():
                  line = raw.strip()
                  if not line or line.startswith('#') or '=' not in line:
                      continue
                  key, value = line.split('=', 1)
                  data[key] = value
              return data

          env = parse(existing_path)
          overlay = {
              'DATABASE_URL': os.environ.get('API_DATABASE_URL', ''),
              'PORT': '8787',
              'API_ALLOWED_ORIGIN': os.environ.get('API_ALLOWED_ORIGIN', ''),
              'PDF_DOWNLOADS_ENABLED': os.environ.get('PDF_DOWNLOADS_ENABLED') or 'true',
              'PDF_RATE_LIMIT_BYPASS_USER_IDS': os.environ.get('PDF_RATE_LIMIT_BYPASS_USER_IDS', ''),
          }
          clerk_secret = os.environ.get('CLERK_SECRET_KEY', '').strip()
          clerk_publishable = os.environ.get('CLERK_PUBLISHABLE_KEY', '').strip()
          if clerk_secret:
              overlay['CLERK_SECRET_KEY'] = clerk_secret
          if clerk_publishable:
              overlay['CLERK_PUBLISHABLE_KEY'] = clerk_publishable
              overlay['VITE_CLERK_PUBLISHABLE_KEY'] = clerk_publishable
          env.update({key: value for key, value in overlay.items() if value is not None})
          if not env.get('CLERK_SECRET_KEY', '').strip():
              raise SystemExit('CLERK_SECRET_KEY missing on host and PRAXIS_CLERK_SECRET_KEY is empty')
          order = [
              'DATABASE_URL',
              'PORT',
              'API_ALLOWED_ORIGIN',
              'PDF_DOWNLOADS_ENABLED',
              'PDF_RATE_LIMIT_BYPASS_USER_IDS',
              'CLERK_SECRET_KEY',
              'CLERK_PUBLISHABLE_KEY',
              'VITE_CLERK_PUBLISHABLE_KEY',
          ]
          lines = []
          seen = set()
          for key in order:
              if key in env:
                  lines.append(f'{key}={env[key]}')
                  seen.add(key)
          for key, value in env.items():
              if key not in seen:
                  lines.append(f'{key}={value}')
          with open(merged_path, 'w', encoding='utf-8') as handle:
              handle.write('\n'.join(lines) + '\n')
          PY
          chmod 600 "${merged}"
          scp -i ~/.ssh/id_ed25519 -P "${AWS_SSH_PORT}" "${merged}" \
            "${AWS_SSH_USER}@${AWS_SSH_HOST}:${DEPLOY_PATH}/.env.api"

      - name: Build and restart API on server
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "${AWS_SSH_PORT}" "${AWS_SSH_USER}@${AWS_SSH_HOST}" "DEPLOY_PATH='${DEPLOY_PATH}' bash -s" <<'EOF'
          set -euo pipefail
          cd "${DEPLOY_PATH}"
          if docker info >/dev/null 2>&1; then
            DOCKER_SUDO=""
          elif sudo docker info >/dev/null 2>&1; then
            DOCKER_SUDO="sudo"
          else
            echo "Docker is unavailable"
            exit 1
          fi

          ${DOCKER_SUDO} docker network create praxis-net >/dev/null 2>&1 || true
          if ${DOCKER_SUDO} docker ps --format '{{.Names}}' | grep -qx praxis-postgres; then
            ${DOCKER_SUDO} docker network connect praxis-net praxis-postgres >/dev/null 2>&1 || true
          fi

          ${DOCKER_SUDO} docker compose -f docker-compose.api.yml up -d --build
          ${DOCKER_SUDO} docker compose -f docker-compose.api.yml ps
          EOF

      - name: Configure nginx reverse proxy
        if: env.API_SERVER_NAME != ''
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "${AWS_SSH_PORT}" "${AWS_SSH_USER}@${AWS_SSH_HOST}" "API_SERVER_NAME='${API_SERVER_NAME}' bash -s" <<'EOF'
          set -euo pipefail
          if ! sudo nginx -v >/dev/null 2>&1; then
            sudo dnf install -y nginx
            sudo systemctl enable --now nginx
          fi

          if sudo test -f "/etc/letsencrypt/live/${API_SERVER_NAME}/fullchain.pem"; then
            sudo tee /etc/nginx/conf.d/praxis-api.conf >/dev/null <<'NGINX'
          server {
            listen 80;
            listen [::]:80;
            server_name __PRAXIS_API_SERVER_NAME__;
            return 301 https://$host$request_uri;
          }

          server {
            listen 443 ssl;
            listen [::]:443 ssl;
            server_name __PRAXIS_API_SERVER_NAME__;

            ssl_certificate /etc/letsencrypt/live/__PRAXIS_API_SERVER_NAME__/fullchain.pem;
            ssl_certificate_key /etc/letsencrypt/live/__PRAXIS_API_SERVER_NAME__/privkey.pem;

            location /api/ {
              proxy_pass http://127.0.0.1:8787;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
            }

            location / {
              return 404;
            }
          }
          NGINX
          else
            sudo tee /etc/nginx/conf.d/praxis-api.conf >/dev/null <<'NGINX'
          server {
            listen 80;
            listen [::]:80;
            server_name __PRAXIS_API_SERVER_NAME__;

            location /api/ {
              proxy_pass http://127.0.0.1:8787;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
            }

            location / {
              return 404;
            }
          }
          NGINX
          fi
          sudo sed -i "s/__PRAXIS_API_SERVER_NAME__/${API_SERVER_NAME}/g" /etc/nginx/conf.d/praxis-api.conf

          sudo nginx -t
          sudo systemctl reload nginx || sudo systemctl restart nginx
          EOF

      - name: Verify API
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "${AWS_SSH_PORT}" "${AWS_SSH_USER}@${AWS_SSH_HOST}" \
            "curl --fail --show-error --silent --retry 8 --retry-connrefused --retry-delay 2 http://127.0.0.1:8787/api/health && echo && curl --fail --show-error --silent --retry 8 --retry-connrefused --retry-delay 2 http://127.0.0.1:8787/api/health/db && echo && curl --fail --show-error --silent --retry 8 --retry-connrefused --retry-delay 2 http://127.0.0.1:8787/api/stats"
          if [[ -n "${API_SERVER_NAME}" ]]; then
            curl --fail --show-error --silent --retry 8 --retry-connrefused --retry-delay 2 "http://${API_SERVER_NAME}/api/health"
            curl --fail --show-error --silent --retry 8 --retry-connrefused --retry-delay 2 "http://${API_SERVER_NAME}/api/health/db"
            curl --fail --show-error --silent --retry 8 --retry-connrefused --retry-delay 2 "http://${API_SERVER_NAME}/api/stats"
          fi
