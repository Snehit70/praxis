# Keep the previous hostname reachable without exposing an edge-filter bypass.
server {
  listen 80;
  listen [::]:80;
  server_name api.praxis.snehit70.dev;
  return 307 https://__PRAXIS_API_SERVER_NAME__$request_uri;
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name api.praxis.snehit70.dev;
  ssl_certificate /etc/letsencrypt/live/api.praxis.snehit70.dev/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.praxis.snehit70.dev/privkey.pem;
  return 307 https://__PRAXIS_API_SERVER_NAME__$request_uri;
}
